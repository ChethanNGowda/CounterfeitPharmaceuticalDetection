name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, sign and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD secret" && exit 1)

      - name: Configure persistent Android signing
        working-directory: frontend/flutter_app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Install dependencies
        working-directory: frontend/flutter_app
        run: flutter pub get

      - name: Analyze and test
        working-directory: frontend/flutter_app
        run: |
          flutter analyze
          flutter test

      - name: Build universal release APK
        working-directory: frontend/flutter_app
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_BUILD: ${{ github.run_number }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          BUILD_NUMBER=$((2000 + RELEASE_BUILD))
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD_NUMBER" --dart-define=PHARMA_APP_VERSION="$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/pharmaassist-android-universal.apk"
          cd "$GITHUB_WORKSPACE"
          sha256sum pharmaassist-android-universal.apk > pharmaassist-android-universal.apk.sha256
          APK_SHA256=$(cut -d' ' -f1 pharmaassist-android-universal.apk.sha256)
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_VERSION}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_VERSION}/pharmaassist-android-universal.apk"
          cat > pharmaassist-update.json <<EOF
          {
            "version": "$VERSION",
            "tag_name": "$RELEASE_VERSION",
            "title": "PharmaAssist $RELEASE_VERSION",
            "notes": "Open the official GitHub release page for the changelog.",
            "release_url": "$RELEASE_URL",
            "apk_url": "$APK_URL",
            "sha256": "$APK_SHA256"
          }
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PharmaAssist ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            pharmaassist-android-universal.apk
            pharmaassist-android-universal.apk.sha256
            pharmaassist-update.json
